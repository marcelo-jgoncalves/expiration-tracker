# Supply-chain-hardened CI pipeline - implementation-blueprint.md #16.1 (M0 deliverable).
#
# Requirements implemented here:
#   - lockfile-pinned, immutable installs (npm ci)
#   - Node version fixed (.nvmrc)
#   - GitHub Actions pinned by commit SHA, not tag
#   - minimal GITHUB_TOKEN permissions
#   - OIDC for AWS (no persistent credentials) - wired when infra/deploy exists (M1+)
#   - SBOM (CycloneDX) generated and attached as an artifact
#   - dependency scan (npm audit as baseline; upgrade to a dedicated scanner when funded)
#   - schema validation gate (schemas/ must load cleanly)
#
# TODO (not blocking M0, tracked for before first real deploy):
#   - artifact signing / provenance (SLSA) - needs a deploy target to sign; add in M1
#     when infra/app.ts + CDK deploy job exist.
#   - verify the exact commit SHAs pinned below are current and re-pin via a scheduled
#     Dependabot/renovate job; SHAs here were pinned at authoring time for the vX.Y.Z tag
#     noted in each comment.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# D-148 / dependency-freshness-standard.md #4 (terraform-cli): single source of truth for
# the pinned Terraform CLI version, mirrored by cd.yml's own top-level env block - before
# this fix each workflow hardcoded "1.15.8" independently, and scripts/check-dependency-
# freshness.ts has no way to prove two independently-hardcoded strings are the same value
# instead of two values that happen to currently match. Bump this AND cd.yml's together.
env:
  TERRAFORM_VERSION: "1.15.8"

jobs:
  guardrails:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install (immutable, scripts disabled)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check architecture boundaries (transitive dependency graph)
        # dependency-cruiser resolves the real module graph, closing a gap ESLint's
        # no-restricted-imports can't: it only matches literal import-specifier text, so it
        # never catches a transitive re-export or a same-module domain->ports import written
        # as a relative path (found and fixed for real 2026-08-19, see decisions-log.md).
        run: npm run check-boundaries

      - name: Validate JSON schemas
        run: npm run validate-schemas

      - name: Check doc drift (broken links, stale AGENTS.md section refs)
        # full-audit round1 (eixo Engenharia de Contexto, criterio "Auditabilidade &
        # Enforcement"): manual review found 10+ broken AGENTS.md section references across
        # three separate audit rounds before this check existed - deterministic enforcement,
        # not relying on a 4th human pass to catch the next one.
        run: npm run check-docs

      - name: Check dependency freshness (D-139/D-148)
        # docs/engineering/dependency-freshness-standard.md - closes the exact gap that let
        # D-137 pass unnoticed (Lambda runtime pinned past AWS's own deprecation date, found
        # only by an unrelated ad-hoc audit). Runs on every PR/push, not just when an audit
        # happens to be touching this code.
        run: npm run check-dependency-freshness

      - name: Unit + contract tests
        run: npm test

      - name: Dependency audit (production - blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (dev - informational, known exceptions in docs/engineering/exceptions.md)
        run: npm audit --audit-level=high || echo "::warning::npm audit found dev-dependency findings - cross-check against docs/engineering/exceptions.md; anything not listed there is a new finding and must be triaged"

      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
        env:
          # npx still respects ignore-scripts from .npmrc for the resolved package itself.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # M3.5 Camada 2 (docs/architecture/m3.5-runtime-design.md): DynamoDB Local via
  # Testcontainers, separate from `guardrails` per the design ("mais pesado, job separado,
  # nao bloqueante do npm test rapido de todo dia") - ubuntu-latest has Docker natively, no
  # extra setup needed.
  dynamodb-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install (immutable, scripts disabled)
        run: npm ci

      - name: DynamoDB Local integration tests
        run: npm run test:dynamodb

  # Frontend Production Foundation (docs/frontend/frontend-production-foundation.md) -
  # frontend/ is a separate npm project (own package.json/lockfile), not part of the root
  # workspace, so it gets its own install/cache/job rather than folding into `guardrails`.
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install (immutable)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + component tests
        run: npm test

      - name: Build (production bundle)
        run: npm run build

      # ADR-0011: contract that makes the CloudFront SPA-routing function's extension-based
      # heuristic safe (infra/modules/spa-hosting/spa-routing.js) - runs here (every PR) AND in
      # cd.yml (before syncing to S3), same script both times, never two divergent checkers.
      - name: SPA build artifact policy (ADR-0011)
        run: node ../scripts/check-spa-build-artifacts.mjs dist

      - name: Dependency audit (production - blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (dev - informational, known exceptions in docs/engineering/exceptions.md)
        run: npm audit --audit-level=high || echo "::warning::npm audit found dev-dependency findings in frontend/ - cross-check against docs/engineering/exceptions.md (EX-002); anything not listed there is a new finding and must be triaged"

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (mocked BFF - see e2e/smoke.spec.ts header)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # ADR-0009: CDK replaced by Terraform. Plan-only here (Tier A/every PR) - apply only
  # happens in cd.yml on push to main, never in this workflow.
  infra:
    name: Validate Infra (Terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install (immutable, scripts disabled)
        run: npm ci

      - name: Build Lambda bundles (terraform plan needs the zip artifacts to exist)
        run: npm run build:lambdas

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC, no persistent secret)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      # Real incident (2026-08-27, NEXT_SESSION_PROMPT.md): `terraform plan` does NOT catch
      # Step Functions ASL schema violations (e.g. States.ALL combined with named error
      # strings in one ErrorEquals) - only a real create/update call does, which is why
      # `terraform apply` broke in cd.yml once already. This calls the same validation API
      # Step Functions itself uses at apply time, before Terraform ever touches the resource.
      - name: Validate Step Functions ASL definitions
        run: |
          set -euo pipefail
          for f in state-machines/*.asl.json; do
            echo "Validating $f"
            output=$(aws stepfunctions validate-state-machine-definition --definition "file://$f" --region us-east-1)
            result=$(echo "$output" | jq -r '.result')
            if [ "$result" != "OK" ]; then
              echo "::error file=infra/$f::ASL validation failed"
              echo "$output" | jq .
              exit 1
            fi
            echo "OK: $f"
          done

      # aws_account_id is only used to build deterministic ARNs (dynamo-table/reminder-queue
      # modules) so IAM policy documents are plan-time-known - derived here, never hardcoded,
      # so this workflow works unmodified if the target account ever changes.
      - name: Resolve AWS account id
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Terraform init (dev)
        run: |
          terraform init \
            -backend-config="bucket=expiration-tracker-dev-tfstate" \
            -backend-config="key=exptrk/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test (recreates test/infra/stack.test.ts's assertions - see ADR-0009)
        run: terraform test -var-file=env/dev.tfvars -var="aws_account_id=${{ steps.account.outputs.id }}"

      - name: Terraform plan (dev) — never apply here
        run: terraform plan -input=false -var-file=env/dev.tfvars -var="aws_account_id=${{ steps.account.outputs.id }}" -lock-timeout=60s
