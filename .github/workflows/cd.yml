# Deploy Pipeline (CD) — ADR-0009 (CDK replaced by Terraform). This is the ONLY place
# `terraform apply` runs — never from a local machine (the user explicitly required this:
# "o apply tem que ser feito pela pipeline, via github actions diretamente no ambiente").
#
# Triggers on `workflow_run` of `CI` completing on `main` (real incident, 2026-08-21, see
# NEXT_SESSION_PROMPT.md): both this workflow and `CI` used to trigger independently on
# `push: branches: [main]`, so a single merge to main fired them AT THE SAME TIME - both run
# `terraform plan` against the SAME S3-native-locked state, and whichever acquires the lock
# first makes the other fail immediately with "Error acquiring the state lock" (a transient,
# confusing failure, not a real stuck lock - a retry always succeeded once the race resolved).
# `workflow_run` makes this deploy strictly SEQUENTIAL after CI's own `infra` job
# (fmt/validate/test/plan) already released the lock - the `if` condition below only
# proceeds when that CI run's conclusion was `success`.
#
# Assumes the same IAM role ci.yml uses for `terraform plan` - AWS_ROLE_ARN_DEV repository
# variable holds its ARN. M5 (2026-08-21): switched from edp-dev-role-cicd-github-actions
# (a shared role from the sibling event-discovery-platform project, whose project-specific
# policy never granted SNS/SES/EventBridge/cross-account Lambda-layer actions this
# milestone's infra needs) to GITHUB-OIDC-ROLE. Its trust policy's `sub` condition must list
# BOTH the classic (`repo:OWNER/REPO:*`) and GitHub's newer immutable
# (`repo:OWNER@orgId/REPO@repoId:*`) subject-claim formats - this account's OIDC provider
# emits the immutable form, and a trust policy missing it fails
# `sts:AssumeRoleWithWebIdentity` with a generic "Not authorized" error that looks identical
# to a real IAM permissions gap (real incident, see NEXT_SESSION_PROMPT.md).

name: Deploy (CD)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# A second push while an apply is in-flight must queue, not race - cancelling a terraform
# apply mid-way can leave a stuck state lock or a partially-created resource.
concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.15.8"

jobs:
  deploy-dev:
    name: Deploy → Dev
    runs-on: ubuntu-latest
    environment: dev
    # Only deploy after CI's own run on main actually succeeded - a workflow_dispatch (no
    # `workflow_run` context) always proceeds; a workflow_run event requires success.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # workflow_run runs in the DEFAULT branch's workflow file context but the
          # triggering commit is on `head_sha` - check that commit out explicitly, or a
          # stale `main` checkout could deploy an outdated Terraform config.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install (immutable, scripts disabled)
        run: npm ci
        working-directory: .

      # Same gates as ci.yml's `guardrails` job — never deploy on a build that would have
      # failed CI (belt-and-suspenders: branch protection should already guarantee this).
      - name: Typecheck + lint + boundaries + tests
        run: |
          npm run typecheck
          npm run lint
          npm run check-boundaries
          npm test
        working-directory: .

      - name: Build Lambda bundles
        run: npm run build:lambdas
        working-directory: .

      - name: Configure AWS credentials (OIDC, no persistent secret)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      # Belt-and-suspenders with ci.yml's identical step - branch protection should already
      # guarantee this passed on the PR, but never apply on a build that would have failed it.
      - name: Validate Step Functions ASL definitions
        run: |
          set -euo pipefail
          for f in state-machines/*.asl.json; do
            echo "Validating $f"
            output=$(aws stepfunctions validate-state-machine-definition --definition "file://$f" --region "${{ env.AWS_REGION }}")
            result=$(echo "$output" | jq -r '.result')
            if [ "$result" != "OK" ]; then
              echo "::error file=infra/$f::ASL validation failed"
              echo "$output" | jq .
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # aws_account_id is only used to build deterministic ARNs (dynamo-table/reminder-queue
      # modules) so IAM policy documents are plan-time-known - derived here, never hardcoded.
      - name: Resolve AWS account id
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Terraform init (dev)
        run: |
          terraform init \
            -backend-config="bucket=expiration-tracker-dev-tfstate" \
            -backend-config="key=exptrk/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      # Rollback design entrega 1 (docs/architecture/reviews/rollback-mechanism-design/
      # codex-round2-final-design.md §2): plan to a file and apply THAT FILE, never a
      # freshly-recomputed plan - closes the real finding that the plan shown in the log and
      # the plan actually applied could silently diverge between two separate `terraform`
      # invocations.
      - name: Terraform plan (saved to file, visible in the run log before anything changes)
        run: |
          terraform plan -input=false -out=tfplan \
            -var-file=env/dev.tfvars -var="aws_account_id=${{ steps.account.outputs.id }}"
          terraform show -no-color tfplan

      - name: Terraform apply (dev) — applies the exact plan file above
        run: terraform apply -auto-approve -input=false tfplan

      - name: Get Terraform outputs
        id: tf
        run: |
          outputs=$(terraform output -json)
          jq -r '"table_name=\(.table_name.value)",
                 "user_pool_id=\(.user_pool_id.value)",
                 "dispatch_queue_url=\(.dispatch_queue_url.value)",
                 "api_endpoint=\(.api_endpoint.value)",
                 "manifest_bucket=\(.deploy_manifest_bucket_name.value)",
                 "spa_bucket=\(.spa_bucket_name.value)",
                 "spa_distribution_id=\(.spa_distribution_id.value)",
                 "spa_distribution_domain=\(.spa_distribution_domain_name.value)"' <<< "$outputs" >> "$GITHUB_OUTPUT"
          echo "$outputs" | jq -c '.lambda_published_versions.value' > /tmp/published_versions.json

      # Proves the apply's resources actually exist and answer, via the same AWS APIs a
      # real integration test would use — not that the application works end-to-end
      # (Camada 3 of m3.5-runtime-design.md's 3-layer test plan is broader than this).
      - name: Post-deploy smoke test (resource existence)
        id: smoke
        run: |
          set -e
          echo "Checking DynamoDB table ${{ steps.tf.outputs.table_name }} ..."
          aws dynamodb describe-table --table-name "${{ steps.tf.outputs.table_name }}" >/dev/null
          echo "OK: table ACTIVE"

          echo "Checking Cognito User Pool ${{ steps.tf.outputs.user_pool_id }} ..."
          aws cognito-idp describe-user-pool --user-pool-id "${{ steps.tf.outputs.user_pool_id }}" >/dev/null
          echo "OK: user pool describable"

          echo "Checking SQS queue ${{ steps.tf.outputs.dispatch_queue_url }} ..."
          aws sqs get-queue-attributes --queue-url "${{ steps.tf.outputs.dispatch_queue_url }}" --attribute-names QueueArn >/dev/null
          echo "OK: dispatch queue describable"

          echo "Checking every function's 'live' alias points at its just-published version ..."
          for fn in $(jq -r 'keys[]' /tmp/published_versions.json); do
            expected=$(jq -r --arg fn "$fn" '.[$fn]' /tmp/published_versions.json)
            actual=$(aws lambda get-alias --function-name "$fn" --name live --query FunctionVersion --output text)
            if [ "$actual" != "$expected" ]; then
              echo "MISMATCH: $fn live alias is at version $actual, expected $expected"
              exit 1
            fi
            echo "OK: $fn live -> v$expected"
          done

      # ADR-0011 etapa 3/4 - the frontend build/deploy: same immutable-by-hash discipline Vite
      # already gives every asset (content-hashed filenames), plus the same
      # scripts/check-spa-build-artifacts.mjs contract ci.yml's frontend job already enforces
      # on every PR (second call site, per ADR-0011 Correção 5 da v6: never two divergent
      # checkers, always this one script both times).
      - name: Install frontend deps (immutable)
        run: npm ci
        working-directory: frontend

      - name: Build frontend (production bundle)
        run: npm run build
        working-directory: frontend

      - name: SPA build artifact policy (ADR-0011)
        run: node ../scripts/check-spa-build-artifacts.mjs dist
        working-directory: frontend

      # No --delete: content-hashed assets (Vite) never collide across deploys, so an old
      # deploy's assets stay reachable in S3 even after index.html moves on - this is what
      # makes "redeploy a previous index.html" a real rollback path (its asset references are
      # still there), not just a coincidence of Vite's hashing. --cache-control immutable is
      # safe for exactly this reason: a given hashed filename's content never changes.
      - name: Sync hashed assets to S3 (cache-forever, never deleted)
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.tf.outputs.spa_bucket }}" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
        working-directory: .

      # index.html is the one file that must be revalidated on every request (it is the only
      # pointer to "which hashed assets are current") - uploaded LAST, after every asset it
      # references is already durably in S3, so a client that gets the new index.html before
      # the sync above finishes is impossible by construction (sequential steps).
      - name: Upload index.html (no-cache, uploaded last on purpose)
        run: |
          aws s3 cp frontend/dist/index.html "s3://${{ steps.tf.outputs.spa_bucket }}/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html"
        working-directory: .

      # CloudFront may have cached the previous index.html at the edge even with
      # Cache-Control: no-cache set on the object (some edge locations may still serve a
      # recently-cached response) - an explicit invalidation is the only way to guarantee
      # every edge location picks up the new pointer immediately, not just eventually.
      - name: Invalidate index.html on CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.spa_distribution_id }}" \
            --paths "/index.html" "/"
        working-directory: .

      # Rollback design entrega 1 §3: the deploy manifest is the source of truth for
      # rollback.yml's default target ("previous healthy deployment"). Only written, and
      # current-healthy only advanced, after apply + alias verification + the shallow
      # smoke test above all succeeded - a failed deploy never becomes a rollback target.
      - name: Persist deploy manifest and advance current-healthy pointer
        if: success()
        run: |
          set -e
          bucket="${{ steps.tf.outputs.manifest_bucket }}"
          deployment_id="${{ github.run_id }}-${{ github.run_attempt }}"
          previous_healthy=""
          if aws s3api head-object --bucket "$bucket" --key pointers/current-healthy.json >/dev/null 2>&1; then
            previous_healthy=$(aws s3 cp "s3://$bucket/pointers/current-healthy.json" - | jq -r '.deploymentId')
          fi

          functions_json=$(jq -c '[to_entries[] | {(.key): {version: .value, alias: "live"}}] | add' /tmp/published_versions.json)

          manifest=$(jq -n \
            --arg schemaVersion "1" \
            --arg deploymentId "$deployment_id" \
            --arg commitSha "${{ github.sha }}" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg environment "dev" \
            --arg workflowRunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg previousHealthyDeploymentId "$previous_healthy" \
            --argjson functions "$functions_json" \
            '{schemaVersion: ($schemaVersion|tonumber), deploymentId: $deploymentId, commitSha: $commitSha,
              createdAt: $createdAt, environment: $environment, workflowRunUrl: $workflowRunUrl,
              previousHealthyDeploymentId: (if $previousHealthyDeploymentId == "" then null else $previousHealthyDeploymentId end),
              functions: $functions, postCheck: {type: "shallow", status: "passed"}, status: "healthy"}')

          echo "$manifest" | aws s3 cp - "s3://$bucket/deployments/$deployment_id.json" --content-type application/json
          echo "$manifest" | aws s3 cp - "s3://$bucket/pointers/current-healthy.json" --content-type application/json
          echo "Manifest persisted: deployments/$deployment_id.json (previousHealthy=${previous_healthy:-none})"

      - name: Deploy summary
        run: |
          {
            echo "### Dev Deploy Complete"
            echo "- **Deployment ID:** ${{ github.run_id }}-${{ github.run_attempt }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Table:** ${{ steps.tf.outputs.table_name }}"
            echo "- **Cognito User Pool:** ${{ steps.tf.outputs.user_pool_id }}"
            echo "- **API endpoint:** ${{ steps.tf.outputs.api_endpoint }}"
            echo "- **Manifest bucket:** ${{ steps.tf.outputs.manifest_bucket }}"
            echo ""
            echo "#### Published Lambda versions"
            echo '```json'
            cat /tmp/published_versions.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
